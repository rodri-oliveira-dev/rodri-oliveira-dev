name: External open-source contributions

on:
  pull_request:
    paths:
      - .github/external-contributions.json
      - .github/external-contributions-catalog.json
      - .github/workflows/external-contributions.yml
      - scripts/external_contributions.py
      - scripts/render_external_contributions.py
      - scripts/propose_external_contributions.py
      - tests/**
      - docs/open-source-contributions.md
      - docs/open-source-contributions.en.md
      - README.md
      - README.en.md
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Propose the verified catalog update from main"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: external-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 1. Validate configuration and offline tests
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate configuration and current catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.external_contributions import load_config
          from scripts.render_external_contributions import load_snapshot

          config = load_config(Path(".github/external-contributions.json"))
          catalog = load_snapshot(Path(".github/external-contributions-catalog.json"))
          assert catalog["profile"] == config["profile"]
          print(f"Validated {catalog['totals']['pull_requests']} PRs in {catalog['totals']['repositories']} repositories")
          PY

      - name: Smoke-test publisher without write authorization
        run: |
          python3 scripts/propose_external_contributions.py \
            --preview-dir "$RUNNER_TEMP/missing" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event pull_request \
            --ref refs/heads/not-main \
            --publish true

      - name: Validate GitHub Actions workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  synchronize:
    name: 2. Discover, reconcile, and render complete catalog
    needs: validate
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect all public external pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p preview/.github preview/docs
          python3 scripts/external_contributions.py \
            --config .github/external-contributions.json \
            --previous .github/external-contributions-catalog.json \
            --output preview/.github/external-contributions-catalog.json

      - name: Render and verify both languages
        run: |
          python3 scripts/render_external_contributions.py \
            --snapshot preview/.github/external-contributions-catalog.json \
            --output-pt preview/docs/open-source-contributions.md \
            --output-en preview/docs/open-source-contributions.en.md \
            --write
          cp preview/docs/open-source-contributions.md "$RUNNER_TEMP/catalog.pt.first.md"
          cp preview/docs/open-source-contributions.en.md "$RUNNER_TEMP/catalog.en.first.md"
          python3 scripts/render_external_contributions.py \
            --snapshot preview/.github/external-contributions-catalog.json \
            --output-pt preview/docs/open-source-contributions.md \
            --output-en preview/docs/open-source-contributions.en.md \
            --write
          cmp preview/docs/open-source-contributions.md "$RUNNER_TEMP/catalog.pt.first.md"
          cmp preview/docs/open-source-contributions.en.md "$RUNNER_TEMP/catalog.en.first.md"

      - name: Summarize verified collection
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("preview/.github/external-contributions-catalog.json").read_text())
          totals = data["totals"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Complete external contributions catalog\n\n")
              summary.write(f"{totals['pull_requests']} PRs across {totals['repositories']} repositories: ")
              summary.write(f"{totals['merged']} merged, {totals['open']} open, ")
              summary.write(f"{totals['closed_unmerged']} closed without merge.\n")
          PY

      - name: Upload validated proposal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-contributions-preview
          path: preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  propose:
    name: 3. Create or update review PR (main only)
    needs: synchronize
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout the exact rendered main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Download validated proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: external-contributions-preview
          path: ${{ runner.temp }}/external-preview

      - name: Propose through the managed branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 scripts/propose_external_contributions.py \
            --preview-dir "$RUNNER_TEMP/external-preview" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --publish "${PUBLISH:-false}"
