name: Validate external contributions collector

on:
  push:
    branches:
      - feat/external-contributions-markdown
    paths:
      - scripts/external_contributions.py
      - tests/test_external_contributions.py
      - .github/external-contributions.json
      - .github/workflows/test-external-contributions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-checks:
    name: Validate collector and public API snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Collect live public contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/external_contributions.py \
            --config .github/external-contributions.json \
            --output "$RUNNER_TEMP/external-contributions-snapshot.json"

      - name: Check collected data invariants
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          snapshot = json.loads((Path(os.environ["RUNNER_TEMP"]) / "external-contributions-snapshot.json").read_text(encoding="utf-8"))
          totals = snapshot["totals"]
          assert snapshot["repositories"] == len(snapshot["projects"])
          assert totals["authored_prs"] == sum(project["authored_prs"] for project in snapshot["projects"])
          assert totals["authored_prs"] == totals["merged_prs"] + totals["open_prs"] + totals["closed_unmerged_prs"]
          assert snapshot["collected_at"].endswith("Z")
          assert all(not project["repository"].lower().startswith("rodri-oliveira-dev/") for project in snapshot["projects"])
          print("Snapshot completo, coerente e limitado a projetos externos.")
          PY
