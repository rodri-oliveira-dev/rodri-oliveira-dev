name: Spell check

on:
  # Required by the main branch ruleset: run on every PR so the required
  # "Check spelling" status is always reported, including workflow-only PRs.
  # Do not add paths filters to pull_request: skipped workflows leave required
  # checks permanently pending ("Expected — Waiting for status to be reported").
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".cspell.json"
      - ".cspell/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/spell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    name: Check spelling
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install language dictionaries
        run: npm ci --ignore-scripts

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: .cspell.json
          files: |
            **/*.md
          incremental_files_only: false
          strict: true
          suggestions: true
          inline: error
          report: all
