name: Spell check

on:
  # Required by the main branch ruleset: run on every PR so the required
  # "Check spelling" status is always reported, including workflow-only PRs.
  # Do not add paths filters to pull_request: skipped workflows leave required
  # checks permanently pending ("Expected — Waiting for status to be reported").
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".cspell.json"
      - ".cspell/**"
      - ".github/workflows/spell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    name: Check spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Brazilian Portuguese dictionary
        run: npm install --no-save --ignore-scripts @cspell/dict-pt-br@2.4.2

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          config: .cspell.json
          files: |
            **/*.md
          incremental_files_only: false
          strict: true
          suggestions: true
          inline: error
          report: all
